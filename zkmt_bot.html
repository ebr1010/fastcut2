<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZKMT Bot（無料版）</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d26;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text: #e2e8f0;
      --text-sub: #94a3b8;
      --user-bg: #1e3a5f;
      --bot-bg: #1e2d4a;
      --error: #f87171;
      --success: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    /* Header */
    #header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    #header .avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold; color: #fff;
      flex-shrink: 0;
    }
    #header .info { flex: 1; }
    #header .name { font-weight: bold; font-size: 16px; }
    #header .status { font-size: 12px; color: var(--text-sub); margin-top: 1px; }
    #settings-btn {
      background: none; border: none; color: var(--text-sub);
      cursor: pointer; font-size: 20px; padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    #settings-btn:hover { background: var(--surface2); color: var(--text); }
    /* API key panel */
    #api-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #api-panel label { font-size: 13px; color: var(--text-sub); white-space: nowrap; }
    #api-key-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      color: var(--text);
      font-size: 13px;
      font-family: monospace;
      outline: none;
    }
    #api-key-input:focus { border-color: var(--accent); }
    #save-key-btn {
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      padding: 6px 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    #save-key-btn:hover { background: var(--accent-hover); }
    #model-select {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      padding: 6px 8px;
      cursor: pointer;
      outline: none;
    }
    /* Chat area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      display: flex;
      gap: 10px;
      max-width: 85%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    .msg .av {
      width: 32px; height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: bold;
    }
    .msg.bot .av {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
    }
    .msg.user .av {
      background: var(--surface2);
      color: var(--text-sub);
      font-size: 14px;
    }
    .bubble {
      background: var(--bot-bg);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg);
      border-radius: 16px;
      border-bottom-right-radius: 4px;
    }
    .bubble .ts {
      display: block;
      font-size: 10px;
      color: var(--text-sub);
      margin-top: 4px;
      text-align: right;
    }
    /* Typing indicator */
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 12px 14px;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-sub);
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
    /* Input area */
    #input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--text-sub); }
    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 18px;
      width: 42px; height: 42px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send-btn:hover { background: var(--accent-hover); }
    #send-btn:disabled { background: var(--border); cursor: not-allowed; }
    /* Reset btn */
    #reset-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-sub);
      font-size: 12px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #reset-btn:hover { border-color: var(--error); color: var(--error); }
    /* Scrollbar */
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    /* Notice */
    .notice {
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      padding: 8px;
    }
  </style>
</head>

let messages = [];
let apiKey = localStorage.getItem('zkmt_api_key') || '';
let model = localStorage.getItem('zkmt_model') || 'gemini-3.8-flash';
let sending = false;

// Init
window.onload = () => {
  if (apiKey) {
    document.getElementById('api-key-input').value = apiKey;
    document.getElementById('status-text').textContent = 'オンライン · ' + model;
  }
  document.getElementById('model-select').value = model;
};

function togglePanel() {
  const p = document.getElementById('api-panel');
  p.style.display = p.style.display === 'none' ? 'flex' : 'none';
}

function saveKey() {
  const k = document.getElementById('api-key-input').value.trim();
  const m = document.getElementById('model-select').value;
  if (!k) { alert('APIキーを入力してください'); return; }
  apiKey = k;
  model = m;
  localStorage.setItem('zkmt_api_key', k);
  localStorage.setItem('zkmt_model', m);
  document.getElementById('status-text').textContent = 'オンライン · ' + m;
  togglePanel();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function addMessage(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');

  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'user' ? '👤' : 'ZKMT';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  const ts = document.createElement('span');
  ts.className = 'ts';
  ts.textContent = new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  bubble.appendChild(ts);

  div.appendChild(av);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addTyping() {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg bot typing';
  div.id = 'typing-indicator';

  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = 'ZKMT';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  [1,2,3].forEach(() => {
    const d = document.createElement('div');
    d.className = 'dot';
    bubble.appendChild(d);
  });

  div.appendChild(av);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function resetChat() {
  if (!confirm('会話履歴をリセットしますか？')) return;
  messages = [];
  const chat = document.getElementById('chat');
  chat.innerHTML = '<div class="notice">会話をリセットしました。</div>';
}

async function sendMessage() {
  if (sending) return;
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;

  if (!apiKey) {
    alert('APIキーが設定されていません。⚙ボタンで設定してください。');
    togglePanel();
    return;
  }

  sending = true;
  document.getElementById('send-btn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addMessage('user', text);
  messages.push({ role: 'user', content: text });

  addTyping();

  try {
    // Gemini API形式に変換（user/model交互）
    const geminiContents = messages.map(m => ({
      role: m.role === 'user' ? 'user' : 'model',
      parts: [{ text: m.content }]
    }));

    const body = JSON.stringify({
      system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: geminiContents,
      generationConfig: { maxOutputTokens: 1024, temperature: 0.9 }
    });

    // リトライ付きfetch（最大3回、指数バックオフ、30秒タイムアウト）
    async function callGemini(modelId, retries = 3) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelId}:generateContent?key=${apiKey}`;
      for (let i = 0; i < retries; i++) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000);
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body,
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          if (res.ok) return res.json();
          const err = await res.json().catch(() => ({}));
          const msg = err?.error?.message || `HTTP ${res.status}`;
          const isOverload = res.status === 503 || msg.includes('high demand') || msg.includes('overloaded');
          if (isOverload && i < retries - 1) {
            document.getElementById('status-text').textContent = `混雑中…再試行 ${i+2}/${retries}`;
            await new Promise(r => setTimeout(r, (i + 1) * 2000));
            continue;
          }
          const overloadErr = new Error(msg);
          overloadErr.isOverload = isOverload;
          throw overloadErr;
        } catch (e) {
          clearTimeout(timeoutId);
          if (e.name === 'AbortError') {
            if (i < retries - 1) {
              document.getElementById('status-text').textContent = `応答待ち…再試行 ${i+2}/${retries}`;
              await new Promise(r => setTimeout(r, 2000));
              continue;
            }
            const timeoutErr = new Error('タイムアウト');
            timeoutErr.isOverload = true;
            throw timeoutErr;
          }
          throw e;
        }
      }
    }

    // フォールバックモデル順
    const fallbacks = [model, 'gemini-2.5-flash', 'gemini-3.5-flash-lite'].filter((v, i, a) => a.indexOf(v) === i);
    let data, usedModel = model;
    for (let fi = 0; fi < fallbacks.length; fi++) {
      try {
        if (fi > 0) document.getElementById('status-text').textContent = `混雑中…${fallbacks[fi]} で再試行`;
        data = await callGemini(fallbacks[fi]);
        usedModel = fallbacks[fi];
        break;
      } catch (e) {
        if (e.isOverload && fi < fallbacks.length - 1) continue;
        throw e;
      }
    }
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '（返答なし）';

    document.getElementById('status-text').textContent = 'オンライン · ' + usedModel;
    removeTyping();
    addMessage('bot', reply);
    messages.push({ role: 'assistant', content: reply });

  } catch (e) {
    removeTyping();
    const chat = document.getElementById('chat');
    const err = document.createElement('div');
    err.className = 'notice';
    err.style.color = 'var(--error)';
    err.textContent = 'エラー: ' + e.message;
    chat.appendChild(err);
    chat.scrollTop = chat.scrollHeight;
    // エラー時はメッセージを履歴から除く
    messages.pop();
  }

  sending = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}
</script>
</body>
